train_manifest: data/full/splits_recovered_all_structures/train.parquet
validation_manifest: data/full/splits_recovered_all_structures/validation.parquet
normalization_file: data/full/processed_recovery/normalization_train.json
output_dir: outputs/recovered_full_b2_v_axial_edm_chain_e003

seed: 42
device: cuda

batch_size: 2
num_workers: 2
gradient_accumulation_steps: 4
mixed_precision: true
amp_dtype: float16

epochs: 5
learning_rate: 0.0001
grad_clip: 1.0
max_consecutive_amp_overflows: 20
ema_decay: 0.999
diffusion_steps: 500
prediction_parameterization: v

physical_auxiliary_loss_enabled: true
physical_auxiliary_loss_weight: 0.01
physical_auxiliary_loss_warmup_steps: 500
edm_subset_size: 64
edm_subsets_per_sample: 1
edm_negative_weight: 1.0
edm_rank3_weight: 1.0
physical_auxiliary_seed: 2002

adjacent_auxiliary_loss_enabled: true
adjacent_auxiliary_loss_weight: 0.0001
adjacent_auxiliary_loss_warmup_steps: 500
adjacent_auxiliary_huber_beta_angstrom: 0.25

model:
  input_channels: 3
  output_channels: 1
  base_channels: 24
  channel_multipliers: [1, 2, 4, 8]
  residual_blocks_per_level: 2
  dropout: 0.0
  group_norm_groups: 8
  attention_heads: 4
  use_bottleneck_attention: true
  # E003 preserves E002/E001 exactly; the new intervention is only the
  # adjacent-chain auxiliary loss configured above.
  use_pre_bottleneck_axial_attention: true
  axial_attention_heads: 4
  axial_attention_dropout: 0.0
  axial_attention_chunk_size: 128
  time_embedding_dim: 256
  length_embedding_dim: 256
  max_length: 500

# Generation diagnostics only; these are not training groups or split bins.
validation_sample_lengths: [64, 128, 256, 500]
samples_per_length: 1

checkpoint_every_steps: 500

logging:
  progress_bar: true
  tensorboard: true
  tensorboard_dir: outputs/recovered_full_b2_v_axial_edm_chain_e003/tensorboard
  log_every_steps: 50
  validation_every_epochs: 1
  image_every_epochs: 1
