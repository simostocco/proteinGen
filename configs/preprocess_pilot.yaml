# Pilot mmCIF preprocessing defaults for RCSB-query-based datasets.
source_dir: data/pilot/raw/mmcif
samples_dir: data/pilot/processed/samples
manifest_path: data/pilot/processed/manifest.parquet
summary_path: data/pilot/processed/preprocess_summary.json
backend: auto
chain_id:
min_length:
max_length: 500
strict_contiguous_ca: true
allowed_methods:
  - X-RAY DIFFRACTION
  - ELECTRON MICROSCOPY
  - SOLUTION NMR
max_xray_resolution_angstrom: 3.0
max_cryoem_resolution_angstrom: 4.0
residue_mappings:
  MSE: MET
overwrite: false
