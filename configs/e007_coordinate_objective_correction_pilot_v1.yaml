  - {name: low_noise, fraction: 0.25}
  - {name: intermediate_noise, fraction: 0.5}
  - {name: high_noise, fraction: 0.75}
  - {name: very_high_noise, fraction: 1.0}

# Contiguous five-bin schedule over t=0..31. Expansion is normalized so the
# exact mean over all 32 discrete timesteps is one.
timestep_weight_bins:
  - {name: very_low_noise, start: 0, end: 6, unnormalized_weight: 0.50}
  - {name: low_noise, start: 7, end: 12, unnormalized_weight: 0.75}
  - {name: intermediate_noise, start: 13, end: 19, unnormalized_weight: 1.00}
  - {name: high_noise, start: 20, end: 25, unnormalized_weight: 1.50}
  - {name: very_high_noise, start: 26, end: 31, unnormalized_weight: 2.00}

