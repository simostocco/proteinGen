heldout_parameter_seed_offset: 900000
bond_length_angstrom: 3.8
coordinate_scale_angstrom: 10.0

optimizer_updates_per_arm_seed: 1000
evaluation_updates: [0, 100, 300, 600, 1000]
learning_rate: 0.0003
weight_decay: 0.01
gradient_clip_norm: 1.0
diffusion_steps: 32
