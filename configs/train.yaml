train_manifest: data/pilot/splits/train.parquet
validation_manifest: data/pilot/splits/validation.parquet
normalization_file: data/pilot/processed/normalization.json
output_dir: outputs/pilot_baseline

seed: 42
device: cuda

# Conservativo per matrici che possono arrivare a circa 500x500.
batch_size: 1
num_workers: 2
gradient_accumulation_steps: 1
mixed_precision: false
amp_dtype: float16
max_optimizer_steps:

epochs: 50
learning_rate: 0.0001
grad_clip: 1.0
max_consecutive_amp_overflows: 20
ema_decay: 0.999

# Più significativo del precedente baseline da 100 step.
diffusion_steps: 500

model:
  input_channels: 3
  output_channels: 1
  base_channels: 32
  channel_multipliers: [1, 2, 4, 8]
  residual_blocks_per_level: 2
  dropout: 0.0
  group_norm_groups: 8
  attention_heads: 8
  use_bottleneck_attention: true
  time_embedding_dim: 256
  length_embedding_dim: 256
  max_length: 500

validation_sample_lengths: [48, 96, 192, 320]
samples_per_length: 2
checkpoint_every_steps: 500
resume_from:

logging:
  progress_bar: true
  tensorboard: true
  tensorboard_dir: outputs/pilot_baseline/tensorboard
  log_every_steps: 10
  validation_every_epochs: 1
  image_every_epochs: 5
