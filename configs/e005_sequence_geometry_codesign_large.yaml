experiment: E005_large_sequence_geometry_codesign
architecture_version: e005_large_sequence_geometry_codesign_v1
seed: 5005
device: cuda
output_dir: outputs/e005_large_sequence_geometry_codesign
mixed_precision: true
amp_dtype: float16

dataset:
  directory: /mnt/d/Users/Simone Stocco/proteinGen_audits/sequence_geometry_pairing_v1
  schema_version: sequence_geometry_pairing_v1
  train_dataset: eligible_train.parquet
  validation_dataset: eligible_validation.parquet
  immutable: true

normalization_file: data/full/processed_recovery/normalization_train.json
masked_token_probability: 0.15

conditioning:
  dropout_probability: 0.10

diffusion:
  steps: 500
  prediction_parameterization: v

loss:
  sequence_weight: 1.0
  geometry_weight: 1.0
  consistency_weight: 0.01

optimizer:
  name: AdamW
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_updates: 1000
  schedule: linear_warmup_cosine_decay
  gradient_clip_norm: 1.0

validation:
  modes:
    - sequence_only
    - learned_geometry_gating
    - forced_geometry_conditioning
  selection_criterion: learned_geometry_gating_macro_sequence_cross_entropy

model:
  vocabulary_size: 22
  pad_token_id: 0
  mask_token_id: 1
  sequence_hidden_dim: 384
  sequence_layers: 8
  sequence_heads: 12
  sequence_feedforward_dim: 1536
  sequence_dropout: 0.1
  max_length: 500
  geometry_model:
    input_channels: 3
    output_channels: 1
    base_channels: 24
    channel_multipliers: [1, 2, 4, 8]
    residual_blocks_per_level: 2
    dropout: 0.0
    group_norm_groups: 8
    attention_heads: 4
    use_bottleneck_attention: true
    use_pre_bottleneck_axial_attention: true
    axial_attention_heads: 4
    axial_attention_dropout: 0.0
    axial_attention_chunk_size: 128
    use_pre_bottleneck_triangle_multiplication: true
    triangle_hidden_channels: 32
    triangle_dropout: 0.0
    triangle_chunk_size: 16
    time_embedding_dim: 256
    length_embedding_dim: 256
    max_length: 500

production:
  training_mode: learned_geometry_gating
  physical_batch_size: 1
  activation_checkpointing: true
  max_rss_mib: 6144
  max_cuda_memory_mib: 8192
  checkpoint_frequency: 250
  validation_frequency: 2500
  validation_panel_size: 256
  validation_corruption_seeds: 3
  maximum_selected_rows: 4096
  maximum_consecutive_skipped_updates: 8
  curriculum:
    - maximum_length: 128
      optimizer_updates: 14000
    - maximum_length: 256
      optimizer_updates: 14000
    - maximum_length: 500
      optimizer_updates: 7000
  pair_budget_accumulation:
    - maximum_padded_length: 64
      microbatches: 16
    - maximum_padded_length: 128
      microbatches: 4
    - maximum_padded_length: 256
      microbatches: 1
    - maximum_padded_length: 384
      microbatches: 1
    - maximum_padded_length: 500
      microbatches: 1

launch_gate:
  requested_length: 500
  optimizer_steps: 1
  maximum_peak_cuda_allocated_mib: 7168
  maximum_peak_cuda_reserved_mib: 8192
  maximum_peak_rss_mib: 6144
