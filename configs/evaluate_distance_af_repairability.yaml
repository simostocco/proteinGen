# Dry-run scaffold only. This config must not execute external Distance-AF jobs.
output_root: reports/experiments/E004_symmetric_triangle_multiplication/distance_af
sample_manifest: null
synthetic_smoke: false

execute_distance_af: false
distance_af_root: /path/to/Distance-AF
distance_af_python: python
