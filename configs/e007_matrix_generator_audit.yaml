matrix_representation:
  physical_unit: angstrom
  stored_model_space: physical_distance_angstrom / scale_angstrom
  normalization:
    mode: scale
    scale_angstrom: 53.775000000000006
  model_channels:
    - noisy_or_clean_normalized_distance
    - relative_sequence_separation_abs_i_minus_j_over_max_N_minus_1_1
    - biological_pair_mask
  padding:
    dynamic_square_padding_factor: 8
    padded_values: 0
    padded_pairs_excluded_by_mask: true
  sampling_projection: symmetric_zero_diagonal_and_pair_masked_at_every_step
  supported_training_length_range: [20, 500]

audit:
  generated_master_seed: 7047
  panel_selection_seed: 7007
  corruption_seed: 7017
  bootstrap_seed: 7027
  bootstrap_iterations: 500
  reference_warning_quantiles: [0.01, 0.99]
  scientific_threshold_policy: reference_quantile_warnings_only
  lengths: [64, 128, 256, 384, 500]
  generated_counts_by_length:
    64: 16
    128: 16
    256: 8
    384: 4
    500: 4
  real_counts_by_length:
    64: 16
    128: 16
    256: 8
    384: 4
    500: 4
  panels:
    - real_validation_matrices
    - reconstructed_real_matrices_where_supported
    - independently_generated_candidate_matrices
    - intentionally_corrupted_controls
    - shuffled_or_invalid_controls
  corruption_controls:
    asymmetry:
      delta_angstrom: 2.0
    nonzero_diagonal:
      value_angstrom: 1.0
    negative_distance:
      value_angstrom: -1.0
    local_chain_disruption:
      adjacent_delta_angstrom: 8.0
    triangle_violation:
      excess_angstrom: 2.0
    non_euclidean_four_point:
      scale_angstrom: 4.0
  missing_valid_pair_control_supported: false

fatal_contract_thresholds:
  maximum_symmetry_error_angstrom: 0.00001
  maximum_diagonal_error_angstrom: 0.00001
  maximum_negative_distance_count: 0
  require_finite: true
  require_square_complete_pair_mask: true

bounds:
  maximum_rss_mib: 4096
  maximum_cuda_allocated_mib: 7168
  maximum_cuda_reserved_mib: 8192
  maximum_batch_size: 2
  triangle_exact_max_length: 64
  triangle_sample_count: 4096
  eigen_exact_max_length: 500
  process_candidates_individually: true
  prohibit_cross_candidate_averaging: true
  runtime_device: cuda

