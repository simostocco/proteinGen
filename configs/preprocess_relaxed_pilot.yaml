# Full filtered preprocessing config with terminal C-alpha trimming.
source_dir: data/relaxed_pilot/raw/mmcif
samples_dir: data/relaxed_pilot/processed/samples
manifest_path: data/relaxed_pilot/processed/manifest.parquet
summary_path: data/relaxed_pilot/processed/preprocess_summary.json
state_db_path: data/relaxed_pilot/processed/preprocess_state.sqlite
backend: auto
min_length: 20
max_length: 500
missing_calpha_policy: trim_terminal
allowed_methods:
  - X-RAY DIFFRACTION
  - ELECTRON MICROSCOPY
  - SOLUTION NMR
max_xray_resolution_angstrom: 3.0
max_cryoem_resolution_angstrom: 4.0
residue_mappings:
  MSE: MET
