train_manifest: data/full/splits_recovered_all_structures/train.parquet
validation_manifest: data/full/splits_recovered_all_structures/validation.parquet
normalization_file: data/full/processed_recovery/normalization_train.json
output_dir: outputs/recovered_full_b2_epsilon

seed: 42
device: cuda

batch_size: 2
num_workers: 2
gradient_accumulation_steps: 4
mixed_precision: true
amp_dtype: float16
max_optimizer_steps:

epochs: 5
learning_rate: 0.0001
grad_clip: 1.0
max_consecutive_amp_overflows: 20
ema_decay: 0.999
diffusion_steps: 500
prediction_parameterization: epsilon

model:
  input_channels: 3
  output_channels: 1
  base_channels: 24
  channel_multipliers: [1, 2, 4, 8]
  residual_blocks_per_level: 2
  dropout: 0.0
  group_norm_groups: 8
  attention_heads: 4
  use_bottleneck_attention: true
  time_embedding_dim: 256
  length_embedding_dim: 256
  max_length: 500

# Generation diagnostics only; these are not training groups or split bins.
validation_sample_lengths: [64, 128, 256, 500]
samples_per_length: 1

checkpoint_every_steps: 2000
resume_from:

logging:
  progress_bar: true
  tensorboard: true
  tensorboard_dir: outputs/recovered_full_b2_epsilon/tensorboard
  log_every_steps: 50
  validation_every_epochs: 1
  image_every_epochs: 1
