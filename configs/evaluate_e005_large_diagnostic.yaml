checkpoint_path: outputs/e005_large_sequence_geometry_codesign/checkpoints/best.pt
training_summary_path: outputs/e005_large_sequence_geometry_codesign/summary.json
training_validation_journal: outputs/e005_large_sequence_geometry_codesign/validation.jsonl
training_configuration_path: configs/e005_sequence_geometry_codesign_large.yaml

panel_size: 1024
