bootstrap_iterations: 10000
bootstrap_seed: 550050
geometry_diagnostic_sample_count: 64
geometry_triangle_samples: 10000
max_rss_mib: 6144
max_cuda_memory_mib: 8192

trajectory:
  plateau_relative_threshold: 0.01
  degradation_relative_threshold: 0.02
