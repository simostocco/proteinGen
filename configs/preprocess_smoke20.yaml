# Full filtered PDB mmCIF preprocessing defaults for RCSB-query-based datasets.
source_dir: data/smoke20/raw/mmcif
samples_dir: data/smoke20/processed/samples
manifest_path: data/smoke20/processed/manifest.parquet
summary_path: data/smoke20/processed/preprocess_summary.json
state_db_path: data/smoke20/processed/preprocess_state.sqlite
backend: auto
min_length: 20
max_length: 500
allowed_methods:
  - X-RAY DIFFRACTION
  - ELECTRON MICROSCOPY
max_xray_resolution_angstrom: 4.0
max_cryoem_resolution_angstrom: 8.0
