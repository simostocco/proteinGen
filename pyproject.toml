[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-distance-diffusion"
version = "0.1.0"
description = "Stage 1 conditional diffusion for protein residue C-alpha distance matrices."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "torch",
  "PyYAML",
  "gemmi",
  "MDAnalysis",
  "matplotlib",
  "seaborn",
  "tqdm",
  "tensorboard",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
